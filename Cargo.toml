[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "TBD"

[workspace.dependencies]
# Game framework
bevy = "0.19"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "1"

# Internal crates
rustypixel-engine = { path = "crates/engine" }
rustypixel-protocol = { path = "crates/protocol" }
rustypixel-scripting = { path = "crates/scripting" }
